<!doctype html>
<html lang="en" data-density="comfortable">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Calibre — career instrumentation</title>
    <meta
      name="description"
      content="Read a CV, LinkedIn profile and GitHub account against a job description, and act on what you find."
    />
    <meta name="theme-color" content="#0f1521" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:ital,wght@0,400..700;1,400..600&display=swap"
    />

    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/components.css" />
    <link rel="stylesheet" href="./styles/shell.css" />
    <link rel="stylesheet" href="./styles/pages.css" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f1521'/%3E%3Cpath d='M6 20h20M10 20v-5M16 20v-9M22 20v-6' stroke='%23e0b65a' stroke-width='2.25' stroke-linecap='square'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <a class="skip-link" href="#workspace">Skip to content</a>

    <div id="app">
      <!-- Shell is rendered by src/shell/layout.js; this is the pre-boot state. -->
      <div class="boot" role="status" aria-live="polite">
        <div class="boot__mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28">
            <path
              d="M4 22h24M9 22v-6M16 22v-11M23 22v-8"
              stroke="currentColor"
              stroke-width="2.25"
              stroke-linecap="square"
              fill="none"
            />
          </svg>
        </div>
        <p class="boot__text">Starting Calibre</p>
      </div>
    </div>

    <div id="overlay-root"></div>
    <div id="toast-root" class="toast-root" role="region" aria-label="Notifications"></div>

    <noscript>
      <div class="noscript">
        <h1>Calibre needs JavaScript</h1>
        <p>
          This is a client-rendered interface. Enable JavaScript to load the workspace, or
          use the API directly at <code>/api/v1</code>.
        </p>
      </div>
    </noscript>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
